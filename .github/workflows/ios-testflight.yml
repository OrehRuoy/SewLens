name: iOS TestFlight

# Pipeline from Oil Due's ios-testflight.yml. Bundle ID is com.sewlens.app.
# Oil Due's native plugin steps are not part of this empty app. The language
# gate is tools/check_ipa_l10n.py (en, de, fr, es, pt-BR, ja, it, nl).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_macos_export:
        description: "Run macOS export + xcodebuild (needs a provisioning profile)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - uses: actions/checkout@v4

      - name: Validate iOS preset and localization
        run: |
          set -euo pipefail
          grep -q 'name="iOS (TestFlight IPA)"' export_presets.cfg
          grep -q 'application/bundle_identifier="com.sewlens.app"' export_presets.cfg
          grep -q 'application/app_store_team_id="9WRNQYQZTB"' export_presets.cfg
          grep -q 'application/export_project_only=true' export_presets.cfg
          grep -q 'application/provisioning_profile_uuid_release=' export_presets.cfg
          test -f tools/ios/patch_xcode_signing.py
          test -f tools/ios/add_store_localizations.py
          test -f addons/sewlens_firebase_config/plugin.cfg
          test -f addons/sewlens_firebase_config/plugin.gd
          test -f tools/check_ipa_l10n.py
          test -f tools/check_csv_complete.py
          python3 tools/check_csv_complete.py
          python3 tools/ios/add_store_localizations.py --self-test
          python3 tools/check_ipa_l10n.py --self-test
          for lang in en de fr es pt-BR ja it nl; do
            test -f "ios/InfoPlist/${lang}.lproj/InfoPlist.strings"
            grep -q 'CFBundleDisplayName' "ios/InfoPlist/${lang}.lproj/InfoPlist.strings"
          done
          if grep -q 'plugins/exported=' export_presets.cfg; then
            echo "::error::Do not use plugins/exported="
            exit 1
          fi
          echo "Preflight OK: SewLens iOS preset and 8 locales"

      - name: Setup Godot
        run: |
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: GUT smoke test
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import || true
          "$GODOT_BIN" --headless --path . -s addons/gut/gut_cmdln.gd -gexit

  build-ios:
    needs: preflight
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_macos_export) }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64" || { echo "::error::Missing APPLE_CERTIFICATE_BASE64"; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "::error::Missing APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64" || { echo "::error::Missing APPLE_PROVISIONING_PROFILE_BASE64"; exit 1; }
          test -n "$APPLE_ID_USERNAME" || { echo "::error::Missing APPLE_ID_USERNAME"; exit 1; }
          test -n "$APPLE_ID_PASSWORD" || { echo "::error::Missing APPLE_ID_PASSWORD"; exit 1; }
          test -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" || { echo "::error::Missing GOOGLE_SERVICE_INFO_PLIST_BASE64"; exit 1; }

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Setup Godot
        run: |
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP"
          TDIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          cp "$RUNNER_TEMP/templates/ios.zip" "$TDIR/"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" build.keychain
          rm certificate.p12

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          sed -i '' "s|application/provisioning_profile_uuid_release=\"[^\"]*\"|application/provisioning_profile_uuid_release=\"${UUID}\"|" export_presets.cfg
          grep -q "application/provisioning_profile_uuid_release=\"${UUID}\"" export_presets.cfg

      - name: Set build number
        run: sed -i '' "s|application/version=\"[^\"]*\"|application/version=\"${GITHUB_RUN_NUMBER}\"|" export_presets.cfg

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/GoogleService-Info.plist
          grep -q '<string>com.sewlens.app</string>' ios/GoogleService-Info.plist

      - name: Export iOS Xcode project
        run: |
          set -euo pipefail
          mkdir -p build
          grep 'application/export_project_only=' export_presets.cfg
          "$GODOT_BIN" --headless --path . --import || true
          "$GODOT_BIN" --headless --path . --export-release "iOS (TestFlight IPA)" "build/SewLens.ipa" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          XCODEPROJ=$(find build -name '*.xcodeproj' | head -1)
          if [[ -z "$XCODEPROJ" ]]; then
            echo "ERROR: no .xcodeproj under build/"
            find build -type d | head -50
            exit 1
          fi
          test -f "$XCODEPROJ/project.pbxproj"
          echo "Xcode project: $XCODEPROJ"
          ls -la build/
          python3 tools/ios/add_store_localizations.py build

      - name: Archive and export IPA
        run: |
          set -euo pipefail
          UUID=$(grep 'application/provisioning_profile_uuid_release=' export_presets.cfg | sed -n 's/.*application\/provisioning_profile_uuid_release="\([^"]*\)".*/\1/p' | tail -1)
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          PROFILE_NAME=$(security cms -D -i "$PROFILE" 2>/dev/null | plutil -extract Name raw -)
          test "$PROFILE_NAME" = "SewLens App Store" || { echo "::error::Provisioning profile name must be SewLens App Store"; exit 1; }
          echo "Provisioning profile name: $PROFILE_NAME"
          XCODEPROJ=$(find build -name '*.xcodeproj' | head -1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          ARCHIVE="build/${SCHEME}.xcarchive"
          printf '%s\n' '{}' | plutil -convert xml1 -o build/ExportOptions.plist -
          /usr/libexec/PlistBuddy -c "Add :method string app-store" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string 9WRNQYQZTB" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.sewlens.app string ${PROFILE_NAME}" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" build/ExportOptions.plist
          plutil -lint build/ExportOptions.plist
          python3 tools/ios/patch_xcode_signing.py build "$PROFILE_NAME"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=9WRNQYQZTB \
            STRIP_INSTALLED_PRODUCT=NO \
            COPY_PHASE_STRIP=NO \
            STRIP_STYLE=non-global \
            archive
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath build \
            -exportOptionsPlist build/ExportOptions.plist
          ls -la build/*.ipa
          test -n "$(ls build/*.ipa 2>/dev/null)"
          IPA=$(ls build/*.ipa | head -1)
          python3 tools/check_ipa_l10n.py "$IPA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SewLens-ipa
          path: build/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          set -euo pipefail
          IPA=$(ls build/*.ipa | head -1)
          xcrun altool --upload-app -t ios -f "$IPA" \
            -u "$APPLE_ID_USERNAME" -p "$APPLE_ID_PASSWORD" --verbose
