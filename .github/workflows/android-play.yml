name: Android Play

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Android preset and localization
        run: |
          set -euo pipefail
          grep -q 'name="Android (Play Store .aab)"' export_presets.cfg
          grep -q 'package/unique_name="com.sewlens.app"' export_presets.cfg
          grep -q 'gradle_build/min_sdk="24"' export_presets.cfg
          grep -q 'gradle_build/target_sdk="36"' export_presets.cfg
          grep -q 'gradle_build/export_format=1' export_presets.cfg
          test -f tools/check_aab_l10n.py
          test -f tools/check_csv_complete.py
          test -f tools/overlay_android_locales.py
          test -f tools/enable_android_firebase.py
          python3 tools/check_csv_complete.py
          python3 tools/check_aab_l10n.py --self-test
          for lang in en de fr es ja it nl; do
            test -f "android/locale-res/values-${lang}/strings.xml"
          done
          test -f android/locale-res/values-pt-rBR/strings.xml
          test -f android/locale-res/values/strings.xml
          if git ls-files | grep -E '\.keystore$|google-services\.json$|GoogleService-Info\.plist$|export_credentials\.cfg$'; then
            echo "::error::Do not commit keystores or service credentials"
            exit 1
          fi
          echo "Preflight OK: SewLens Android preset and 8 locales"

  build-android:
    needs: preflight
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.6.3"
    steps:
      - uses: actions/checkout@v4

      - name: Require upload secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          if [ "$ANDROID_KEYSTORE_PASSWORD" != "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Godot uses one release password. ANDROID_KEY_PASSWORD must match ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Setup Godot
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP"
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          cp "$RUNNER_TEMP/templates/"* "$TDIR/"
          mkdir -p "$HOME/.config/godot"
          python3 -c 'import os; from pathlib import Path; Path.home().joinpath(".config/godot/editor_settings-4.6.tres").write_text("[gd_resource type=\"EditorSettings\" format=3]\n\n[resource]\nexport/android/android_sdk_path = \"%s\"\nexport/android/java_sdk_path = \"%s\"\n" % (os.environ["ANDROID_HOME"], os.environ["JAVA_HOME"]))'

      - name: Install Android build template and locales
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import || true
          "$GODOT_BIN" --headless --path . --install-android-build-template
          python3 tools/overlay_android_locales.py

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/google-services.json
          python3 tools/enable_android_firebase.py

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD<<EOF"
            echo "$ANDROID_KEYSTORE_PASSWORD"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set version code
        run: sed -i "s|version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg

      - name: Export AAB
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release "Android (Play Store .aab)" "build/SewLens.aab"
          test -f build/SewLens.aab
          unzip -l build/SewLens.aab | grep -q 'arm64-v8a/libgodot_android.so'

      - name: Install bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$HOME/bundletool.jar" "https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar"
          mkdir -p "$HOME/bin"
          printf '%s\n' '#!/bin/sh' 'exec java -jar "$HOME/bundletool.jar" "$@"' > "$HOME/bin/bundletool"
          chmod +x "$HOME/bin/bundletool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check Android localization
        run: python3 tools/check_aab_l10n.py build/SewLens.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SewLens-aab
          path: build/SewLens.aab
          retention-days: 7

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sewlens.app
          releaseFiles: build/SewLens.aab
          track: internal
          status: completed
