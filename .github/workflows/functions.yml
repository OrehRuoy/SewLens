name: functions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Glossary and sewing guides
        run: python3 tools/check_glossary.py

      - name: IAP listings
        run: python3 tools/check_iap_listings.py

      - name: FreeSewing license is MIT
        run: |
          set -euo pipefail
          LICENSE=$(npm view @freesewing/core license)
          test "$LICENSE" = "MIT"

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Test with the functions emulator
        run: npx --prefix functions firebase emulators:exec --only functions --project sewlens-app "npm test --prefix functions"
